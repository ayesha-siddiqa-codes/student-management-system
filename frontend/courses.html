<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses - StudentMS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<script>
    const admin = localStorage.getItem("admin");

    if (!admin) {
        window.location.href = "index.html";
    }
</script>
    <div class="sidebar">

        <h2>StudentMS</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="attendance.html">Attendance</a>
        <a href="marks.html">Marks</a>
        <a href="courses.html" class="active">Courses</a>

        <a href="index.html" class="logout">
            Logout
        </a>

    </div>

    <main class="main-content">

        <header class="students-header">

            <div>
                <h1>Courses</h1>
                <p>Manage all courses</p>
            </div>

            <button onclick="showAddCourse()">
                + Add Course
            </button>

        </header>

        <div id="courseFormContainer" class="form-container">

            <h2>Add New Course</h2>

            <form id="courseForm">

                <div class="form-grid">

                    <div>
                        <label>Course Name</label>
                        <input
                            type="text"
                            id="courseName"
                            placeholder="Enter course name"
                            required
                        >
                    </div>

                    <div>
                        <label>Course Code</label>
                        <input
                            type="text"
                            id="courseCode"
                            placeholder="Enter course code"
                            required
                        >
                    </div>

                    <div>
                        <label>Duration</label>
                        <input
                            type="text"
                            id="courseDuration"
                            placeholder="Example: 4 Years"
                            required
                        >
                    </div>

                    <div>
                        <label>Department</label>
                        <input
                            type="text"
                            id="courseDepartment"
                            placeholder="Enter department"
                            required
                        >
                    </div>

                </div>

                <div class="form-buttons">

                    <button type="submit">
                        Add Course
                    </button>

                    <button
                        type="button"
                        onclick="hideAddCourse()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>
        <div class="stats">
    <div class="stat-card">
        <h3>Total Courses</h3>
        <p id="courseCount">0</p>
    </div>
</div>

        <div class="dashboard-card">

            <div class="table-header">

                <h2>All Courses</h2>

                <input
                    type="text"
                    id="courseSearch"
                    placeholder="Search courses..."
                    oninput="searchCourses()"
                >

            </div>

            <table>

                <thead>

                    <tr>
                        <th>Course Name</th>
                        <th>Course Code</th>
                        <th>Duration</th>
                        <th>Department</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="coursesTable"></tbody>

            </table>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
