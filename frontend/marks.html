```
<!-- SIDEBAR -->
<aside class="sidebar">

<!-- MAIN CONTENT -->
<main class="main-content">

    <!-- PAGE HEADER -->
    <header>

        <h1>Marks</h1>

        <p>
            Record and manage student academic performance
        </p>

    </header>


    <!-- ADD MARKS -->
    <section class="dashboard-card">

        <div class="table-header">

            <div>

                <h2>Add Marks</h2>

                <p style="color: #7b8194; font-size: 13px;">
                    Enter marks for a student's subject
                </p>

            </div>

        </div>


        <form id="marksForm">

            <div class="form-grid">

                <!-- STUDENT -->
                <div>

                    <label for="marksStudent">
                        Student
                    </label>

                    <select
                        id="marksStudent"
                        required
                    >

                        <option value="">
                            Select Student
                        </option>

                    </select>

                </div>


                <!-- SUBJECT -->
                <div>

                    <label for="marksSubject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="marksSubject"
                        placeholder="Enter subject"
                        required
                    >

                </div>


                <!-- MARKS -->
                <div>

                    <label for="marksValue">
                        Marks
                    </label>

                    <input
                        type="number"
                        id="marksValue"
                        min="0"
                        max="100"
                        placeholder="0 - 100"
                        required
                    >

                </div>

            </div>


            <div class="form-buttons">

                <button type="submit">
                    Save Marks
                </button>

            </div>

        </form>

    </section>


    <!-- MARKS RECORDS -->
    <section class="dashboard-card">

        <div class="table-header">

            <div>

                <h2>Marks Records</h2>

                <p style="color: #7b8194; font-size: 13px;">
                    View student academic performance
                </p>

            </div>

        </div>


        <table>

            <thead>

                <tr>
                    <th>Student</th>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>

            </thead>


            <tbody id="marksTable">

                <!-- Marks records loaded by JavaScript -->

            </tbody>

        </table>

    </section>

</main>


<!-- JAVASCRIPT -->
<script src="script.js"></script>
```

</body>

</html>
